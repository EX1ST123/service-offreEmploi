# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate/JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# This ensures tables are created automatically on startup
spring.jpa.hibernate.ddl-auto=update 
# Print SQL queries to the console (optional but helpful for debugging)
spring.jpa.show-sql=true

# Enable the H2 Web Console (optional, useful for viewing data)
spring.h2.console.enabled=true

# Keep the Render port binding
server.port=${PORT:8080}
